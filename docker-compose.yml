# Raspberry Pi 4 (8 GB, 64-bit OS) setup: two scanner workers.
# The web app is deployed to Netlify (see web/netlify.toml); it is only started here with
#   docker compose --profile web up
#
# Two workers let two different scans run at the same time. Each has 2 browser tabs, so a single
# scan crawls at the same speed as before, but one big scan no longer blocks the next one.
# Only worker-1 runs Lighthouse, so the Pi never runs two Lighthouse Chromes at once.
# Report emails need RESEND_API_KEY, EMAIL_FROM and a public SITE_URL in .env (see .env.example).

x-worker: &worker
  build:
    context: .
    dockerfile: worker/Dockerfile
  image: a11y-scan-worker
  env_file: .env
  shm_size: 1gb # Chromium needs more than Docker's 64 MB default
  mem_limit: 3g # one runaway Chromium can't take down the whole Pi
  restart: unless-stopped
  stop_grace_period: 30s # let the current page finish; an interrupted scan resumes after ~2 min
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" } # keep logs from filling the SSD

services:
  worker-1:
    <<: *worker
    environment:
      WORKER_CONCURRENCY: 2
      LIGHTHOUSE_ENABLED: "true"

  worker-2:
    <<: *worker
    environment:
      WORKER_CONCURRENCY: 2
      LIGHTHOUSE_ENABLED: "false"

  # Owner-only usage dashboard. Never exposed publicly: it listens on ADMIN_BIND only
  # (127.0.0.1 by default; set the Pi's Tailscale IP to reach it from your laptop/phone).
  # The admin account lives in ./admin-data on the Pi (create it with
  #   docker compose run --rm admin npm run create-user).
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: a11y-scan-admin
    env_file: .env
    volumes:
      - ./admin-data:/data
    ports: ["${ADMIN_BIND:-127.0.0.1}:3001:3001"]
    shm_size: 512mb # Chromium for snapshot PDF / PNG exports
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional: run the web app on the Pi as well instead of Netlify.
  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file: .env
    ports: ["3000:3000"]
    restart: unless-stopped
