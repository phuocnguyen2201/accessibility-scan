# Netlify site settings for this monorepo:
#   Base directory:    (leave empty = repo root, so npm workspaces install packages/shared)
#   Package directory: web
# Netlify detects Next.js and adds its runtime automatically (server actions, proxy.ts, route handlers).
# Paths below are relative to the repo root.

[build]
  command = "npm run build -w web"
  publish = "web/.next"

[build.environment]
  NODE_VERSION = "24"
  # The worker's postinstall downloads Chromium; the web build doesn't need it.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
